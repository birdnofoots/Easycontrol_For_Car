plugins {
  id 'com.android.application' version '8.1.3'
}

android {
  namespace 'top.eiyooooo.easycontrol.app'
  compileSdk 34

  defaultConfig {
    applicationId 'top.eiyooooo.easycontrol.app'
    minSdk 21
    targetSdk 34
    versionCode 10702
    versionName "1.7.2"
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
    }
  }

  viewBinding {
    enabled = true
  }

  // 固定签名：密钥库由环境变量注入（CI 里来自 GitHub Secrets）。
  // 未提供时保持 AGP 默认行为（本地构建用随机 debug 密钥）。
  // 注意：务必妥善备份 keystore，丢失后无法覆盖安装/升级。
  signingConfigs {
    release {
      String ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
      if (ksPath != null && !ksPath.isEmpty()) {
        storeFile file(ksPath)
        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias System.getenv("ANDROID_KEY_ALIAS")
        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        enableV1Signing true
        enableV2Signing true
        enableV3Signing true
      }
    }
  }

  buildTypes {
    debug {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
      debuggable true
      // 有固定密钥时 debug 也用同一密钥签名，保证与 release 包可互相覆盖安装
      if (System.getenv("ANDROID_KEYSTORE_PATH")) {
        signingConfig signingConfigs.release
      }
    }
    release {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
      debuggable false
      // 关闭 R8 混淆/裁剪：经真机实测，开启 minify 后 R8 full mode 会破坏
      // 现有代码（static 单例/hiddenapi 反射相关），表现为启动后 onPause() 抛 NPE
      // （Attempt to read from field on a null object reference）。
      // 已确认仅 proguard 规则不足以修复，故保持与 debug 相同的代码形态，
      // 仅保留 debuggable=false 等 release 特性。如需体积优化，需先补充完整 keep 规则并在真机回归。
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (System.getenv("ANDROID_KEYSTORE_PATH")) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  packagingOptions {
    resources.excludes.add("META-INF/*")
  }

}

dependencies {
  implementation 'com.github.MuntashirAkon:libadb-android:3.0.0'
  implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
  implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
